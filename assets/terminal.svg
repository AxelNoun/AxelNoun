<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 384" width="1280" height="384" role="img" aria-label="An animated terminal: reproduce the bug with a failing test, apply the smallest fix, run the whole suite, open the pull request, get it merged.">
<style>.cv{fill:#0B0F14}
.cur{fill:#FDE725;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.all{animation:fo 15.0s linear infinite}@keyframes fo{0%,94%{opacity:1}98%,100%{opacity:0}}
.c0{animation:k0 15.0s infinite}@keyframes k0{0%{transform:translateX(0)}7.33%{transform:translateX(0);animation-timing-function:steps(67,end)}21.63%,100%{transform:translateX(790px)}}
.c1{animation:k1 15.0s infinite}@keyframes k1{0%{transform:translateX(0)}23.96%{transform:translateX(0);animation-timing-function:steps(41,end)}24.29%,100%{transform:translateX(492px)}}
.c2{animation:k2 15.0s infinite}@keyframes k2{0%{transform:translateX(0)}33.63%{transform:translateX(0);animation-timing-function:steps(70,end)}48.56%,100%{transform:translateX(825px)}}
.c3{animation:k3 15.0s infinite}@keyframes k3{0%{transform:translateX(0)}54.23%{transform:translateX(0);animation-timing-function:steps(38,end)}62.33%,100%{transform:translateX(457px)}}
.c4{animation:k4 15.0s infinite}@keyframes k4{0%{transform:translateX(0)}64.67%{transform:translateX(0);animation-timing-function:steps(68,end)}65.00%,100%{transform:translateX(802px)}}
.c5{animation:k5 15.0s infinite}@keyframes k5{0%{transform:translateX(0)}74.33%{transform:translateX(0);animation-timing-function:steps(67,end)}88.63%,100%{transform:translateX(790px)}}
.c6{animation:k6 15.0s infinite}@keyframes k6{0%{transform:translateX(0)}90.96%{transform:translateX(0);animation-timing-function:steps(27,end)}91.29%,100%{transform:translateX(330px)}}</style>
<rect x=".5" y=".5" width="1279" height="383" rx="14" fill="#0B0F14" stroke="#30363D"/>
<path d="M1,40 H1279" stroke="#21262D"/>
<circle cx="26" cy="20" r="6" fill="#FF5F57"/>
<circle cx="46" cy="20" r="6" fill="#FEBC2E"/>
<circle cx="66" cy="20" r="6" fill="#28C840"/>
<text x="640.0" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#6E7681">how a fix reaches upstream — the order never changes</text>
<clipPath id="win"><rect x="2" y="42" width="1276" height="340"/></clipPath>
<g clip-path="url(#win)"><g class="all"><text x="34" y="90" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" xml:space="preserve"><tspan fill="#3FB950">$ </tspan><tspan fill="#E6EDF3">pytest -q tests/test_regression.py</tspan><tspan fill="#6E7681">   # 1. reproduce the bug first</tspan></text>
<rect class="cv c0" x="32" y="65" width="790" height="34"/>
<text x="34" y="127" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" xml:space="preserve"><tspan fill="#FF7B72">F</tspan><tspan fill="#FF7B72">  1 failed: assert simulated == expected</tspan></text>
<rect class="cv c1" x="32" y="102" width="492" height="34"/>
<text x="34" y="164" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" xml:space="preserve"><tspan fill="#3FB950">$ </tspan><tspan fill="#E6EDF3">git apply smallest-possible-fix.patch</tspan><tspan fill="#6E7681">   # 2. fix only what is broken</tspan></text>
<rect class="cv c2" x="32" y="139" width="825" height="34"/>
<text x="34" y="201" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" xml:space="preserve"><tspan fill="#3FB950">$ </tspan><tspan fill="#E6EDF3">pytest -q</tspan><tspan fill="#6E7681">   # 3. nothing else breaks</tspan></text>
<rect class="cv c3" x="32" y="176" width="457" height="34"/>
<text x="34" y="238" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" xml:space="preserve"><tspan fill="#3FB950">........................................................</tspan><tspan fill="#3FB950">  all passed</tspan></text>
<rect class="cv c4" x="32" y="213" width="802" height="34"/>
<text x="34" y="275" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" xml:space="preserve"><tspan fill="#3FB950">$ </tspan><tspan fill="#E6EDF3">gh pr create --fill</tspan><tspan fill="#6E7681">   # 4. explain it upstream, follow the review</tspan></text>
<rect class="cv c5" x="32" y="250" width="790" height="34"/>
<text x="34" y="312" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" xml:space="preserve"><tspan fill="#3FB950">✓ </tspan><tspan fill="#3FB950">merged by the maintainers</tspan></text>
<rect class="cv c6" x="32" y="287" width="330" height="34"/></g></g>
<text x="34" y="349" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#3FB950">$ </text><rect class="cur" x="59" y="331" width="11" height="22"/>
</svg>